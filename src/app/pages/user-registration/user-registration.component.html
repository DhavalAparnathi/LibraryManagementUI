<div class="register-container">
  <h2 class="text-xl font-bold mb-3">Register</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <div class="mb-3">
      <label>User Name</label>
      <input formControlName="userName" type="text" class="input" />
      <div
        *ngIf="
          registerForm.get('userName')?.touched &&
          registerForm.get('userName')?.invalid
        "
        class="text-danger"
      >
        User Name is required.
      </div>
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input formControlName="email" type="email" class="input" />
      <div
        *ngIf="
            registerForm.get('email')?.touched &&
            registerForm.get('email')?.errors?.['required']
          "
        class="text-danger"
      >
        Email is required.
      </div>
      <div
        *ngIf="
            registerForm.get('email')?.touched &&
            registerForm.get('email')?.errors?.['email']
          "
        class="text-danger"
      >
        Enter a valid email.
      </div>
    </div>

    <div class="mb-3">
      <label>Phone Number</label>
      <input formControlName="phoneNumber" type="text" class="input" />
      <div
        *ngIf="
            registerForm.get('phoneNumber')?.touched &&
            registerForm.get('phoneNumber')?.errors?.['required']
          "
        class="text-danger"
      >
        Phone Number is required.
      </div>
      <div
        *ngIf="
            registerForm.get('phoneNumber')?.touched &&
            registerForm.get('phoneNumber')?.errors?.['pattern']
          "
        class="text-danger"
      >
        Enter a valid 10-digit phone number.
      </div>
    </div>

    <div class="mb-3 relative">
      <label>Password</label>
      <input
        formControlName="password"
        [type]="passwordVisible ? 'text' : 'password'"
        class="input"
      />
      <button
        type="button"
        class="absolute right-2 top-9 text-gray-600"
        (click)="togglePasswordVisibility('password')"
        aria-label="Toggle password visibility"
      >
        {{ passwordVisible ? "Hide" : "Show" }}
      </button>
      <div
        *ngIf="
          registerForm.get('password')?.touched &&
          registerForm.get('password')?.invalid
        "
        class="text-danger"
      >
        Password is required.
      </div>
    </div>

    <div class="mb-3 relative">
      <label>Confirm Password</label>
      <input
        formControlName="confirmPassword"
        [type]="confirmPasswordVisible ? 'text' : 'password'"
        class="input"
      />
      <button
        type="button"
        class="absolute right-2 top-9 text-gray-600"
        (click)="togglePasswordVisibility('confirmPassword')"
        aria-label="Toggle password visibility"
      >
        {{ confirmPasswordVisible ? "Hide" : "Show" }}
      </button>
      <div
        *ngIf="
          registerForm.get('confirmPassword')?.touched &&
          registerForm.get('confirmPassword')?.invalid
        "
        class="text-danger"
      >
        Confirm Password is required.
      </div>
    </div>

    <button type="submit" class="btn">Register</button>
  </form>
</div>
